name: Verify AWS GitHub OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/emulator-ci-isolation

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-verification
  cancel-in-progress: false

jobs:
  verify-aws-identity:
    name: Verify GitHub-to-AWS authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub OIDC identity claims (no token output)
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export OIDC_JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          python3 - <<'PY'
          import os, json, base64
          token = os.environ["OIDC_JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY
          unset OIDC_JWT response

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::447001318269:role/GitHub-Sunrise-Sunset-EC2-Spot
          aws-region: us-east-2

      - name: Verify AWS identity and region
        shell: bash
        run: |
          aws sts get-caller-identity
          test "$(aws configure get region)" = "us-east-2"
          echo "AWS authentication and region verification succeeded."
