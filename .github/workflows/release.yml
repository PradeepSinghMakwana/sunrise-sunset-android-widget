name: Release Android app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Audit, build, and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify tag, version, and location permissions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/release-audit.sh

      - name: Validate genuine physical-device store screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import sys

          directory = Path("fastlane/metadata/android/en-US/images/phoneScreenshots")
          required = {
              "01-app-setup.png": "the real app setup screen",
              "02-home-screen-widget.png": "the real launcher home screen with the widget",
          }
          hashes = set()

          for filename, description in required.items():
              path = directory / filename
              if not path.is_file():
                  sys.exit(f"FAIL: missing {description}: {path}")
              data = path.read_bytes()
              if len(data) < 10_000:
                  sys.exit(f"FAIL: screenshot is too small to be a credible full-screen capture: {path}")
              if data[:8].hex() != "89504e470d0a1a0a" or data[12:16] != b"IHDR":
                  sys.exit(f"FAIL: {path} is not a valid PNG image")
              width, height = struct.unpack(">II", data[16:24])
              if not (320 <= width <= 3840 and 320 <= height <= 3840):
                  sys.exit(f"FAIL: unexpected screenshot dimensions {width}x{height}: {path}")
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  sys.exit("FAIL: setup and widget screenshots are identical")
              hashes.add(digest)
              print(f"PASS: {filename}: {width}x{height}, {len(data)} bytes ({description})")

          print("PASS: both required physical-device screenshots are present and structurally valid.")
          print("A human must visually review the images before creating the release tag.")
          PY

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Audit resolved release dependencies
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath \
            > release-reports/gradle-release-dependencies.txt
          if grep -E 'FAILED|Could not resolve|Could not find' release-reports/gradle-release-dependencies.txt; then
            echo "Dependency resolution failure detected" >&2
            exit 1
          fi

      - name: Generate version-specific F-Droid metadata
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/generate-fdroid-metadata.sh

      - name: Package exact tagged source
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz \
            --prefix="sunrise-sunset-clock-${GITHUB_REF_NAME}/" \
            "refs/tags/${GITHUB_REF_NAME}" \
            -o "release-reports/sunrise-sunset-clock-${GITHUB_REF_NAME}-source.tar.gz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            release-reports/sunrise-sunset-clock-${{ github.ref_name }}-source.tar.gz
            release-reports/com.sunrisesunset.clock.yml
            release-reports/permissions-and-version.txt
            release-reports/gradle-release-dependencies.txt
            fastlane/metadata/android/en-US/images/phoneScreenshots/01-app-setup.png
            fastlane/metadata/android/en-US/images/phoneScreenshots/02-home-screen-widget.png
