name: Release Android app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Audit, build, and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify Semantic Version tag matches Gradle versionName
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/semver-release-validation.sh

      - name: Verify tag, version, and location permissions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/release-audit.sh

      - name: Validate release script syntax
        run: bash -n scripts/release-audit.sh scripts/semver-release-validation.sh scripts/generate-fdroid-metadata.sh

      - name: Run CommitGuard (mandatory release validation)
        run: bash scripts/commit-guard.sh

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify non-Pixel Nexus 5X AVD profile exists
        run: python3 scripts/avd_profile_validation.py 'Nexus 5X'

      - name: Capture release screenshots on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          profile: Nexus 5X
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-android-ui-tests.sh

      - name: Validate Android 13 emulator screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import sys

          directory = Path("android-13-screenshots")
          required = ["01-app-setup.png", "02-home-screen-widget.png"]
          hashes = set()
          for filename in required:
              path = directory / filename
              if not path.is_file():
                  sys.exit(f"FAIL: missing Android 13 emulator screenshot: {path}")
              data = path.read_bytes()
              if len(data) < 10_000 or data[:8].hex() != "89504e470d0a1a0a" or data[12:16] != b"IHDR":
                  sys.exit(f"FAIL: invalid or incomplete PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if not (320 <= width <= 3840 and 320 <= height <= 3840):
                  sys.exit(f"FAIL: unexpected dimensions {width}x{height}: {path}")
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  sys.exit("FAIL: setup and widget screenshots are identical")
              hashes.add(digest)
              print(f"PASS: {filename}: {width}x{height}, {len(data)} bytes (Android 13 emulator)")
          PY

      - name: Upload Android 13 release screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-13-emulator-release-screenshots-and-diagnostics
          path: android-13-screenshots/
          if-no-files-found: warn

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Audit resolved release dependencies
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath \
            > release-reports/gradle-release-dependencies.txt
          if grep -E 'FAILED|Could not resolve|Could not find' release-reports/gradle-release-dependencies.txt; then
            echo "Dependency resolution failure detected" >&2
            exit 1
          fi

      - name: Generate version-specific F-Droid metadata
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/generate-fdroid-metadata.sh

      - name: Package exact tagged source
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz \
            --prefix="sunrise-sunset-clock-${GITHUB_REF_NAME}/" \
            "refs/tags/${GITHUB_REF_NAME}" \
            -o "release-reports/sunrise-sunset-clock-${GITHUB_REF_NAME}-source.tar.gz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            release-reports/sunrise-sunset-clock-${{ github.ref_name }}-source.tar.gz
            release-reports/com.sunrisesunset.clock.yml
            release-reports/permissions-and-version.txt
            release-reports/gradle-release-dependencies.txt
            android-13-screenshots/01-app-setup.png
            android-13-screenshots/02-home-screen-widget.png
