name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JVM-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  detekt:
    name: Detekt Kotlin static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Apply Detekt formatting corrections
        run: gradle :app:detekt --auto-correct || true
      - name: Upload corrected Kotlin sources
        uses: actions/upload-artifact@v4
        with:
          name: detekt-autocorrected-sources
          path: app/src/
      - name: Run Detekt
        run: gradle :app:detekt
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: warn

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  apk-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  emulator-tests:
    name: Android emulator instrumentation and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run instrumentation tests and capture diagnostics on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/run-emulator-tests.sh
      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Sunset-Clock-emulator-screenshots-and-diagnostics
          path: screenshots/
          if-no-files-found: warn
