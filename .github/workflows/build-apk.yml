name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Capture genuine app screenshot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.sunrisesunset.clock/files/screenshots/01-app-setup.png screenshots/01-app-setup.png
            adb pull /sdcard/Android/data/com.sunrisesunset.clock/files/screenshots/02-home-screen-widget.png screenshots/02-home-screen-widget.png
      - uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Sunset-Clock-genuine-screenshots
          path: screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
