name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  # Keep independent build/test lanes. Documentation pushes must not cancel emulator verification.
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Install live artifact uploader
        run: npm install --no-save --no-package-lock @actions/artifact@2.3.3
      - name: Capture genuine app and launcher widget screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/run-emulator-screenshot-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sunrise-Sunset-Clock-genuine-screenshots-and-diagnostics
          path: screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
