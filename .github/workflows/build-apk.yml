name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Capture genuine app and launcher widget screenshots on Android emulator
        if: github.event_name != 'push'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            mkdir -p screenshots/diagnostics
            echo "=== Emulator boot state ===" > screenshots/diagnostics/emulator-state.txt
            adb shell getprop >> screenshots/diagnostics/emulator-state.txt 2>&1
            adb shell wm size >> screenshots/diagnostics/emulator-state.txt 2>&1
            adb shell wm density >> screenshots/diagnostics/emulator-state.txt 2>&1
            gradle :app:connectedDebugAndroidTest
            test_status=$?
            echo "$test_status" > screenshots/diagnostics/instrumentation-exit-code.txt
            adb logcat -d -v threadtime > screenshots/diagnostics/logcat.txt 2>&1
            adb shell dumpsys activity activities > screenshots/diagnostics/activities.txt 2>&1
            adb shell dumpsys window > screenshots/diagnostics/windows.txt 2>&1
            adb shell dumpsys package com.sunrisesunset.clock > screenshots/diagnostics/app-package.txt 2>&1
            adb shell screencap -p /sdcard/ci-final-screen.png
            adb pull /sdcard/ci-final-screen.png screenshots/diagnostics/emulator-final-screen.png
            adb exec-out run-as com.sunrisesunset.clock tar -cf - files/screenshots > screenshots/diagnostics/app-private-files.tar 2> screenshots/diagnostics/run-as-error.txt
            if [ -s screenshots/diagnostics/app-private-files.tar ]; then
              tar -xf screenshots/diagnostics/app-private-files.tar -C screenshots/diagnostics
            fi
            adb shell ls -la /sdcard/Android/data/com.sunrisesunset.clock/files/screenshots > screenshots/diagnostics/external-files.txt 2>&1
            adb pull /sdcard/Android/data/com.sunrisesunset.clock/files/screenshots/. screenshots/ 2>/dev/null || true
            exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: Sunrise-Sunset-Clock-genuine-screenshots-and-diagnostics
          path: screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
