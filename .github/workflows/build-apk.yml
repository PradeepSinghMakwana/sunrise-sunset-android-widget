name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-validation:
    name: Validate CI helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n scripts/run-emulator-screenshot-tests.sh
          bash -n scripts/run-emulator-tests.sh
      - name: Validate artifact uploader JavaScript syntax
        run: node --check scripts/upload-screenshot-artifact.cjs

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JVM-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  detekt:
    name: Detekt Kotlin static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run Detekt
        run: gradle :app:detekt
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: warn

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  apk-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  emulator-tests:
    name: Android emulator instrumentation and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK for emulator installation
        run: gradle assembleDebug
      - name: Install live artifact uploader
        run: npm install --no-save --no-package-lock @actions/artifact@2.3.2
      - name: Make artifact runtime credentials available to checkpoint uploader
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
      - name: Capture genuine app and launcher widget screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -cores 4 -memory 4096
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/run-emulator-screenshot-tests.sh
      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Sunset-Clock-genuine-screenshots-and-diagnostics
          path: screenshots/
          if-no-files-found: warn
