name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-validation:
    name: Validate release scripts (no emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release script syntax
        run: bash -n scripts/release-audit.sh scripts/generate-fdroid-metadata.sh
      - name: Test AVD profile existence validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JVM-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  detekt:
    name: Detekt Kotlin static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run Detekt
        run: gradle :app:detekt
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: warn

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  apk-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Sunrise-Sunset-Clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-13-ui-tests:
    name: Android 13 API 33 emulator UI and screenshot tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify non-Pixel Nexus 5X AVD profile exists
        run: python3 scripts/avd_profile_validation.py 'Nexus 5X'
      - name: Run instrumented UI tests on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          profile: Nexus 5X
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-android-ui-tests.sh
      - name: Upload Android 13 UI test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-13-API-33-UI-test-evidence
          path: |
            android-13-screenshots/
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn
